---
# Spins up a local CentOS Stream 10 GenericCloud VM on libvirt
# (qemu:///system) using virt-install --import against the official CentOS
# Stream cloud image. No provisioning is done — the VM is created and started
# as-is. This is the CentOS Stream 10 counterpart of create-vm.yml (which
# targets Fedora Cloud); keep the two in sync.
#
# Usage:
#   ansible-playbook automation/vms/playbooks/create-vm-centos.yml \
#     -e vm_name=my-centos-vm \
#     -e libvirt_pool_dir=~/libvirt
#
# Requires: dnf, qemu-kvm, libvirt, virt-install, and a running libvirtd —
# install/enable these yourself first (see playbooks/README.md). The
# playbook talks to libvirt as the invoking user over qemu:///system, so that
# user must already be authorized (e.g. member of the `libvirt` group) as is
# the case for interactive `virsh` use.
#
# libvirt_pool_dir defaults to ~/libvirt so the whole playbook runs as the
# invoking user, with no `become`/sudo at all. Before the VM will boot, the
# disk at vm_disk_path must be owned by qemu:qemu (see playbooks/README.md
# for the one-time chown step).
#
# centos_image_build pins an exact CentOS Stream GenericCloud build; bump it
# by hand when a new respin comes out — see
# https://cloud.centos.org/centos/10-stream/x86_64/images/ for current values.

- name: Create a local CentOS Stream 10 GenericCloud libvirt VM
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    vm_name: "centos-stream-10"
    vm_vcpus: 2
    vm_memory_mb: 4096
    vm_disk_gb: 20
    vm_network: "default"

    libvirt_pool_name: "mojesaldoo-vms"
    libvirt_pool_dir: "{{ lookup('env', 'HOME') }}/libvirt"

    centos_stream_release: "10"
    centos_image_build: "20250728.1"
    centos_image_filename: "CentOS-Stream-GenericCloud-{{ centos_stream_release }}-{{ centos_image_build }}.x86_64.qcow2"
    centos_images_base_url: "https://cloud.centos.org/centos/{{ centos_stream_release }}-stream/x86_64/images"
    centos_image_url: "{{ centos_images_base_url }}/{{ centos_image_filename }}"
    centos_checksum_url: "{{ centos_images_base_url }}/{{ centos_image_filename }}.SHA256SUM"

    cached_images_dir: "{{ libvirt_pool_dir }}/.cached-images"
    base_image_path: "{{ cached_images_dir }}/{{ centos_image_filename }}"
    vm_disk_path: "{{ libvirt_pool_dir }}/{{ vm_name }}.qcow2"

  tasks:
    - name: Ensure the libvirt storage pool directory exists
      ansible.builtin.file:
        path: "{{ libvirt_pool_dir }}"
        state: directory
        mode: "0711"

    - name: Check whether the libvirt storage pool is already defined
      ansible.builtin.command: virsh --connect qemu:///system pool-info {{ libvirt_pool_name }}
      register: pool_info
      changed_when: false
      failed_when: false

    - name: Define the libvirt storage pool
      when: pool_info.rc != 0
      ansible.builtin.command: >
        virsh --connect qemu:///system pool-define-as {{ libvirt_pool_name }}
        dir --target {{ libvirt_pool_dir }}

    - name: Build and start the storage pool, and enable autostart
      ansible.builtin.command: "{{ item }}"
      loop:
        - "virsh --connect qemu:///system pool-build {{ libvirt_pool_name }} --build"
        - "virsh --connect qemu:///system pool-start {{ libvirt_pool_name }}"
        - "virsh --connect qemu:///system pool-autostart {{ libvirt_pool_name }}"
      when: pool_info.rc != 0
      changed_when: true
      failed_when: false

    - name: Ensure the cached images directory exists
      ansible.builtin.file:
        path: "{{ cached_images_dir }}"
        state: directory
        mode: "0711"

    - name: Check whether the cloud image is already cached
      ansible.builtin.stat:
        path: "{{ base_image_path }}"
      register: cached_image_stat

    - name: Fetch the published SHA256SUM file for the cloud image
      when: not cached_image_stat.stat.exists
      ansible.builtin.uri:
        url: "{{ centos_checksum_url }}"
        return_content: true
      register: centos_checksum_raw

    # CentOS publishes a per-image BSD-style SHA256SUM sidecar
    # ("SHA256 (<filename>) = <hash>"), the same format Fedora uses.
    - name: Extract the SHA256 checksum for the image file
      when: not cached_image_stat.stat.exists
      ansible.builtin.set_fact:
        centos_image_sha256: >-
          {{ centos_checksum_raw.content
             | regex_search('SHA256 \(' ~ centos_image_filename ~ '\) = ([0-9a-f]{64})', '\1')
             | first }}

    - name: Download the CentOS Stream GenericCloud image (checksum-verified)
      when: not cached_image_stat.stat.exists
      ansible.builtin.get_url:
        url: "{{ centos_image_url }}"
        dest: "{{ base_image_path }}"
        checksum: "sha256:{{ centos_image_sha256 }}"
        mode: "0644"
        timeout: 600

    - name: Check whether the VM disk already exists
      ansible.builtin.stat:
        path: "{{ vm_disk_path }}"
      register: vm_disk_stat

    - name: Create a per-VM qcow2 disk backed by the base cloud image
      when: not vm_disk_stat.stat.exists
      ansible.builtin.command: >
        qemu-img create -f qcow2 -F qcow2
        -b {{ base_image_path }}
        {{ vm_disk_path }} {{ vm_disk_gb }}G

    - name: Check whether the VM is already defined
      ansible.builtin.command: virsh --connect qemu:///system dominfo {{ vm_name }}
      register: vm_info
      changed_when: false
      failed_when: false

    - name: Define and start the VM with virt-install
      when: vm_info.rc != 0
      ansible.builtin.command: >
        virt-install
        --connect qemu:///system
        --name {{ vm_name }}
        --memory {{ vm_memory_mb }}
        --vcpus {{ vm_vcpus }}
        --osinfo detect=on,require=off
        --import
        --disk path={{ vm_disk_path }},format=qcow2,bus=virtio
        --network network={{ vm_network }},model=virtio
        --graphics none
        --console pty,target_type=serial
        --noautoconsole

    - name: Ensure the VM is running
      ansible.builtin.command: virsh --connect qemu:///system start {{ vm_name }}
      register: vm_start
      changed_when: "'error' not in vm_start.stderr"
      failed_when: >
        vm_start.rc != 0 and 'already active' not in vm_start.stderr
