---
# Runs Django's manage.py loaddata inside the mojesaldoo-backend Quadlet
# container on the VM, loading a local JSON fixture (e.g. one produced by
# export-data.yml) into the running instance.
#
# The backend container runs under rootless Podman as app_user (see
# provision-vm.yml), so podman exec/cp need XDG_RUNTIME_DIR/
# DBUS_SESSION_BUS_ADDRESS set — this playbook resolves those the same way
# export-data.yml does.
#
# The backend container only bind-mounts media/ and logs/ (see
# templates/mojesaldoo-backend.container.j2) — /tmp is not shared with the
# host — so the fixture is copied to a VM host temp path first, then
# `podman cp` moves it into the container for loaddata to read.
#
# Usage:
#   ansible-playbook automation/vms/playbooks/import-data.yml \
#     -e datafile=./exports/mydata.json

- name: Import a data fixture into the MojeSaldoo VM
  hosts: mojesaldoo_vms
  gather_facts: false

  vars:
    app_user: "zedr"
    mojesaldoo_backend_container: "mojesaldoo-backend"
    mojesaldoo_container_import_path: "/tmp/import-data.json"

  tasks:
    - name: Assert that datafile was provided
      ansible.builtin.assert:
        that: datafile is defined
        fail_msg: >-
          datafile is required, e.g.:
          ansible-playbook automation/vms/playbooks/import-data.yml -e datafile=./exports/mydata.json

    # The local connection plugin chdirs into this playbook's own directory,
    # not the directory ansible-playbook was invoked from — so a relative
    # datafile must be resolved against $PWD explicitly (same trick
    # export-data.yml uses for export_dir) rather than left relative.
    - name: Resolve the datafile path relative to the invocation directory
      ansible.builtin.set_fact:
        mojesaldoo_datafile_path: "{{ datafile if datafile.startswith('/') else (lookup('env', 'PWD') + '/' + datafile) }}"

    - name: Check that the local datafile exists
      ansible.builtin.stat:
        path: "{{ mojesaldoo_datafile_path }}"
      register: mojesaldoo_datafile_stat
      delegate_to: localhost
      become: false
      run_once: true

    - name: Assert that the local datafile exists
      ansible.builtin.assert:
        that: mojesaldoo_datafile_stat.stat.exists
        fail_msg: "datafile not found on the control host: {{ mojesaldoo_datafile_path }}"

    # now() is a live function, not a constant — computed via set_fact here
    # so every later reference to import_timestamp resolves to the same
    # value instead of re-evaluating (and drifting) on each use.
    - name: Compute the import timestamp
      ansible.builtin.set_fact:
        import_timestamp: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%S') }}"

    - name: Set the VM host temp path for the datafile
      ansible.builtin.set_fact:
        import_host_path: "/tmp/mojesaldoo-loaddata-{{ import_timestamp }}.json"

    - name: Determine the app user's UID (for rootless Podman exec)
      ansible.builtin.command: "id -u {{ app_user }}"
      register: mojesaldoo_uid_result
      changed_when: false

    - name: Set facts derived from the app user's UID
      ansible.builtin.set_fact:
        mojesaldoo_user_env:
          XDG_RUNTIME_DIR: "/run/user/{{ mojesaldoo_uid_result.stdout }}"
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ mojesaldoo_uid_result.stdout }}/bus"

    - name: Copy the datafile to the VM, load it, and clean up afterward
      block:
        - name: Copy the datafile to the VM host
          ansible.builtin.copy:
            src: "{{ mojesaldoo_datafile_path }}"
            dest: "{{ import_host_path }}"
            mode: "0600"

        - name: Copy the datafile into the backend container
          ansible.builtin.command: >
            podman cp {{ import_host_path }}
            {{ mojesaldoo_backend_container }}:{{ mojesaldoo_container_import_path }}
          become: true
          become_user: "{{ app_user }}"
          environment: "{{ mojesaldoo_user_env }}"
          changed_when: true

        - name: Run manage.py loaddata inside the backend container
          ansible.builtin.command: >
            podman exec {{ mojesaldoo_backend_container }} python3.12 manage.py loaddata
            {{ mojesaldoo_container_import_path }}
          become: true
          become_user: "{{ app_user }}"
          environment: "{{ mojesaldoo_user_env }}"
          changed_when: true
      always:
        - name: Remove the temp file from inside the container
          ansible.builtin.command: >
            podman exec {{ mojesaldoo_backend_container }} rm -f
            {{ mojesaldoo_container_import_path }}
          become: true
          become_user: "{{ app_user }}"
          environment: "{{ mojesaldoo_user_env }}"
          changed_when: true
          failed_when: false

        - name: Remove the temp file from the VM host
          ansible.builtin.file:
            path: "{{ import_host_path }}"
            state: absent

    - name: Report what was imported
      ansible.builtin.debug:
        msg: "Imported {{ datafile }} into {{ mojesaldoo_backend_container }} on {{ inventory_hostname }}"
